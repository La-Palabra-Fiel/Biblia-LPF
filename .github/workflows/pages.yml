name: Publicar el sitio en GitHub Pages

on:
  push:
    branches: [main, master]
    paths:
      - "site/**"
      - "translation/**"
      - "alignment/**"
      - "pipeline/**/*.human-review.json"
      - "pipeline/**/*.candidate-human-reviewed.json"
      - "tools/publication_progress.py"
      - "STATUS.md"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  HUGO_VERSION: 0.148.2

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar Hugo (extended)
        run: |
          curl -sSL -o hugo.deb \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i hugo.deb
          hugo version

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configurar Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Generar el contenido desde translation/
        working-directory: ./site
        run: python3 tools/build-content.py

      - name: Compilar el sitio
        working-directory: ./site
        env:
          HUGO_ENVIRONMENT: production
        run: |
          hugo \
            --gc \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./site/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
