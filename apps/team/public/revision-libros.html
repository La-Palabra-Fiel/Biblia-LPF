<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Revisión de libro LPF</title><style>
:root{--ink:#1d2922;--paper:#f5f0e6;--card:#fffdf8;--line:#c9bfad;--green:#245d45;--red:#9a3030}*{box-sizing:border-box}html{font-size:21px}body{margin:0;background:var(--paper);color:var(--ink);font-family:Georgia,serif;line-height:1.7}main{width:min(1040px,calc(100% - 28px));margin:auto;padding:32px 0 90px}h1{font-size:clamp(2.2rem,7vw,4rem);line-height:1.05}h2{font-size:2rem}.card{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:clamp(20px,4vw,38px);margin:24px 0}input,button{font:inherit;padding:11px 14px;border-radius:9px;border:2px solid var(--line)}input{width:min(100%,520px);display:block;margin-top:7px}button{cursor:pointer;background:white}.primary{background:var(--green);color:white;border-color:var(--green);font-weight:bold}.verse{display:grid;grid-template-columns:2.6rem 1fr;gap:12px;font-size:1.12rem;margin:0 0 1em}.number{font:bold .8rem/2 sans-serif;color:var(--green);text-align:right}.signatures{display:flex;flex-wrap:wrap;gap:9px}.signature{background:#e5f2e9;border-radius:999px;padding:7px 12px;font-family:sans-serif;font-size:.82rem}.sign{position:sticky;bottom:12px;box-shadow:0 8px 30px #0002}.message{font-family:sans-serif;font-weight:bold}.error{color:var(--red)}@media(max-width:700px){html{font-size:18px}.verse{grid-template-columns:2rem 1fr}}
</style></head><body><main><h1>Revisión de libro</h1><section id="view"><section class="card">Abriendo el enlace privado…</section></section></main><script>
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));const query=new URLSearchParams(location.search),book=query.get("book")||"",accessKey=query.get("key")||"";let current;
async function post(url,data={}){const r=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({...data,book,accessKey})}),v=await r.json();if(!r.ok)throw Error(v.error||"No se pudo completar la acción.");return v}function date(value){return new Date(value).toLocaleDateString("es",{year:"numeric",month:"long",day:"numeric"})}function signatures(rows){return rows.length?`<div class="signatures">${rows.map(x=>`<span class="signature">✓ ${esc(x.name)} · ${esc(date(x.signedOn))}</span>`).join("")}</div>`:"<p>Todavía no hay firmas para esta versión.</p>"}
async function openBook(){const root=$("#view");if(!book||!accessKey){root.innerHTML='<section class="card error">Este enlace privado no está completo.</section>';return}try{current=await post("/api/revision-libros/libro");const alreadySigned=current.signatures.some(x=>x.name.toLocaleLowerCase("es")===current.reviewer.toLocaleLowerCase("es"));root.innerHTML=`<section class="card"><h2>${esc(current.label)}</h2><p>Este enlace pertenece a <b>${esc(current.reviewer)}</b>.</p><p>Lee el libro completo. Al final podrás escribir tu nombre y firmar.</p><h3>Firmas</h3>${signatures(current.signatures)}</section>${current.chapters.map(c=>`<section class="card"><h2>Capítulo ${c.chapter}</h2>${c.verses.map(v=>`<p class="verse"><span class="number">${v.verse}</span><span>${esc(v.text).replace(/\*([^*]+)\*/g,"<em>$1</em>")}</span></p>`).join("")}</section>`).join("")}<section class="card sign"><p><b>Si leíste ${esc(current.label)} completo y apruebas esta traducción, escribe tu nombre completo.</b></p>${alreadySigned?`<p class="message">Ya firmaste esta versión.</p>`:`<label>Nombre completo<input id="signed-name" autocomplete="name" placeholder="${esc(current.reviewer)}"></label><p><button id="sign" class="primary">Firmar</button></p><p id="message" class="message error"></p>`}</section>`;if($("#sign"))$("#sign").onclick=sign}catch(e){root.innerHTML=`<section class="card error">${esc(e.message)}</section>`}}
async function sign(){const signedName=$("#signed-name").value.trim(),message=$("#message");if(!signedName){message.textContent="Escribe tu nombre completo.";return}if(!confirm(`Confirmo que leí ${current.label} completo y apruebo esta traducción.`))return;const button=$("#sign");button.disabled=true;try{await post("/api/revision-libros/firmar",{translationSha256:current.translationSha256,confirmed:true,signedName});await openBook();window.scrollTo({top:0,behavior:"smooth"})}catch(e){message.textContent=e.message;button.disabled=false}}
openBook();
</script></body></html>
