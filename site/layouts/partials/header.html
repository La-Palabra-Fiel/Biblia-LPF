<header class="sitio-cabecera">
  <div class="envoltura cabecera-fila">
    <a class="marca" href="{{ site.Home.RelPermalink }}">
      <span class="marca-nombre">La Palabra Fiel</span>
      <span class="marca-sigla">LPF</span>
    </a>

    <nav class="nav-principal" aria-label="Navegación principal">
      <ul>
        {{- range site.Menus.main }}
        {{- $activo := or ($.IsMenuCurrent "main" .) ($.HasMenuCurrent "main" .) }}
        <li><a href="{{ .URL }}"{{ if $activo }} aria-current="page"{{ end }}>{{ .Name }}</a></li>
        {{- end }}
      </ul>
    </nav>

    <button class="btn-tema" type="button" data-accion="tema" aria-label="Cambiar entre modo claro y oscuro" title="Modo claro / oscuro">
      <svg class="icono-sol" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="4.2" fill="currentColor"/><g stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M12 2.5v2.2M12 19.3v2.2M4.2 12H2M22 12h-2.2M5.6 5.6 7.2 7.2M16.8 16.8l1.6 1.6M18.4 5.6 16.8 7.2M7.2 16.8 5.6 18.4"/></g></svg>
      <svg class="icono-luna" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M20 14.4A8.6 8.6 0 0 1 9.6 4 8.6 8.6 0 1 0 20 14.4Z"/></svg>
    </button>
  </div>
</header>
